name: Source archive

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-archive.yml
      - scripts/**
      - scenes/**
      - project.godot
      - export_presets.cfg
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Godot project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pack source
        run: |
          zip -r PokeSurvival-Fuentes.zip project.godot export_presets.cfg README.md scripts scenes assets tests docs tools .gitignore
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PokeSurvival-Fuentes
          path: PokeSurvival-Fuentes.zip
          retention-days: 7
